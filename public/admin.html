<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReVolt Drive | Admin</title><style>:root{--g:#9cff00;--bg:#070707;--card:#111;--line:#2a2a2a;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{height:52px;max-width:180px;object-fit:contain}.btn{background:var(--g);color:#000;border:0;border-radius:8px;padding:11px 15px;font-weight:900;cursor:pointer}.btn.dark{background:#202020;color:#fff;border:1px solid #444}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.panel h2{margin:0 0 15px;font-size:18px}.import{display:flex;gap:8px}.import input{flex:1}.input{width:100%;background:#090909;color:#fff;border:1px solid #3a3a3a;border-radius:7px;padding:11px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.label{font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;display:block}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.cars{display:grid;gap:10px}.car{border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;justify-content:space-between;gap:15px}.car b{display:block}.muted{color:var(--muted);font-size:12px}.price{color:var(--g);font-size:20px;font-weight:950}.notice{margin:10px 0;padding:10px;border-radius:8px;background:#171717;color:#ddd;font-size:12px}.warn{border-left:3px solid #e5b000}.ok{border-left:3px solid var(--g)}@media(max-width:800px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><img class="logo" src="images/logo.svg"><a class="btn dark" href="/">← Verejný web</a></div><div class="grid"><section class="panel"><h2>➕ Pridať vozidlo z inzerátu</h2><div class="import"><input id="url" class="input" placeholder="Vlož AutoScout24 / mobile.de URL"><button class="btn" onclick="importCar()">IMPORTOVAŤ</button></div><div id="msg"></div></section><section class="panel"><h2>Vozidlá v ponuke</h2><div id="cars" class="cars">Načítavam…</div></section><section class="panel full" id="editor" style="display:none"><h2>Upraviť vozidlo</h2><div class="form"><div><label class="label">Názov</label><input id="title" class="input"></div><div><label class="label">Podtitul</label><input id="subtitle" class="input"></div><div><label class="label">Rok</label><input id="year" class="input"></div><div><label class="label">Kilometre</label><input id="km" class="input"></div><div><label class="label">Výkon</label><input id="power" class="input"></div><div><label class="label">Dojazd</label><input id="range_km" class="input"></div><div><label class="label">Pohon</label><input id="drive" class="input"></div><div><label class="label">Farba</label><input id="color" class="input"></div><div><label class="label">Predajná cena (€)</label><input id="price_eur" class="input"></div><div><label class="label">Stav</label><select id="status" class="input"><option value="available">VOĽNÉ</option><option value="reserved">REZERVOVANÉ</option><option value="sold">PREDANÉ</option></select></div><div class="full"><label class="label">Popis</label><textarea id="description" class="input" rows="4"></textarea></div></div><div class="actions"><button class="btn" onclick="save()">ULOŽIŤ ZMENY</button><button class="btn dark" onclick="removeCar()">ZMAZAŤ</button></div></section></div></div><script>
let current=null;async function importCar(){const url=document.getElementById("url").value.trim();if(!url)return note("Vlož URL.","warn");note("Importujem údaje a fotografie…","ok");try{const r=await fetch("/api/import",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({url})});const x=await r.json();if(!r.ok)throw Error(x.error||"Import zlyhal");current={title:x.imported.title||"Nové vozidlo",subtitle:"",year:x.imported.year,km:x.imported.km,power:x.imported.power,range_km:x.imported.range_km,drive:x.imported.drive,color:x.imported.color,price_eur:x.imported.price_eur||0,purchase_price_eur:0,status:"available",description:x.imported.description,images:x.imported.images,equipment:x.imported.equipment||[],source_url:x.source};fill(current);note(`Import hotový. Fotografie: ${current.images?.length||0}. Skontroluj údaje a nastav svoju predajnú cenu.`,"ok")}catch(e){note(e.message,"warn")}}
function fill(c){document.getElementById("editor").style.display="block";for(const k of ["title","subtitle","year","km","power","range_km","drive","color","price_eur","purchase_price_eur","status","description"])document.getElementById(k).value=c[k]??""}
async function save(){if(!current)return;const b={id:current.id,title:v("title"),subtitle:v("subtitle"),year:v("year"),km:v("km"),power:v("power"),range_km:v("range_km"),drive:v("drive"),color:v("color"),price_eur:v("price_eur"),purchase_price_eur:v("purchase_price_eur"),status:v("status"),description:v("description"),images:current.images||[],equipment:current.equipment||[],source_url:current.source_url||""};const r=await fetch("/api/cars",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});const x=await r.json();if(!r.ok)return note(x.error||"Uloženie zlyhalo","warn");current.id=x.id;note("Vozidlo uložené.","ok");loadCars()}
async function loadCars(){try{const r=await fetch("/api/cars");const x=await r.json();document.getElementById("cars").innerHTML=(x.cars||[]).map(c=>`<div class="car"><div><b>${esc(c.title)}</b><span class="muted">${esc(c.year||"")} • ${esc(c.km||"")} • ${c.status==="sold"?"PREDANÉ":c.status==="reserved"?"REZERVOVANÉ":"VOĽNÉ"}</span></div><div><span class="price">${fmt(c.price_eur)}</span> <button class="btn dark" onclick="edit('${c.id}')">Upraviť</button></div></div>`).join("")||"Zatiaľ žiadne vozidlá."}catch{document.getElementById("cars").innerHTML="D1 zatiaľ nie je nakonfigurovaná."}}
async function edit(id){const r=await fetch("/api/cars/"+id);const x=await r.json();current={...x.car,images:x.photos.map(p=>p.url),equipment:x.equipment};fill(current);scrollTo({top:500,behavior:"smooth"})}
async function removeCar(){if(!current?.id)return;if(!confirm("Naozaj zmazať vozidlo?"))return;await fetch("/api/cars/"+current.id,{method:"DELETE"});current=null;document.getElementById("editor").style.display="none";loadCars()}
function v(id){return document.getElementById(id).value}function note(t,c){document.getElementById("msg").innerHTML=`<div class="notice ${c||""}">${esc(t)}</div>`}function fmt(v){return new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(v)||0)}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}loadCars();
</script></body></html>
