<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReVolt Drive | Admin</title><style>:root{--g:#9cff00;--bg:#070707;--card:#111;--line:#2a2a2a;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{height:52px;max-width:180px;object-fit:contain}.btn{background:var(--g);color:#000;border:0;border-radius:8px;padding:11px 15px;font-weight:900;cursor:pointer}.btn.dark{background:#202020;color:#fff;border:1px solid #444}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.panel h2{margin:0 0 15px;font-size:18px}.import{display:flex;gap:8px}.import input{flex:1}.input{width:100%;background:#090909;color:#fff;border:1px solid #3a3a3a;border-radius:7px;padding:11px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.label{font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;display:block}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.cars{display:grid;gap:10px}.car{border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;justify-content:space-between;gap:15px}.car b{display:block}.muted{color:var(--muted);font-size:12px}.price{color:var(--g);font-size:20px;font-weight:950}.notice{margin:10px 0;padding:10px;border-radius:8px;background:#171717;color:#ddd;font-size:12px}.warn{border-left:3px solid #e5b000}.ok{border-left:3px solid var(--g)}.progressBox{margin-top:10px}.progressTrack{height:9px;background:#252525;border-radius:99px;overflow:hidden}.progressBar{height:100%;width:0;background:var(--g);transition:width .25s ease}.progressBar.busy{width:45%;animation:progressMove 1.1s ease-in-out infinite alternate}@keyframes progressMove{from{margin-left:0}to{margin-left:55%}}.progressText{font-size:12px;color:#ddd;margin-top:6px}@media(max-width:800px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><img class="logo" src="images/logo.svg"><a class="btn dark" href="/">← Verejný web</a></div><div class="grid"><section class="panel"><h2>➕ Pridať vozidlo z inzerátu</h2><div class="import"><input id="url" class="input" placeholder="Vlož AutoScout24 / mobile.de URL"><button class="btn" onclick="importCar()">IMPORTOVAŤ</button></div><div id="msg"></div></section><section class="panel"><h2>Vozidlá v ponuke</h2><div class="actions" style="margin:0 0 10px"><button class="btn dark" onclick="toggleAllCars()">VYBRAŤ / ZRUŠIŤ VŠETKY</button><button class="btn" onclick="deleteSelectedCars()">ZMAZAŤ VYBRANÉ</button><span id="selectedCount" class="muted" style="align-self:center"></span></div><div id="cars" class="cars">Načítavam…</div></section><section class="panel full" id="editor" style="display:none"><h2>Upraviť vozidlo</h2><div class="form"><div><label class="label">Názov</label><input id="title" class="input"></div><div><label class="label">Podtitul</label><input id="subtitle" class="input"></div><div><label class="label">Rok</label><input id="year" class="input"></div><div><label class="label">Kilometre</label><input id="km" class="input"></div><div><label class="label">Výkon</label><input id="power" class="input"></div><div><label class="label">Dojazd</label><input id="range_km" class="input"></div><div><label class="label">Pohon</label><select id="drive" class="input"><option value="">-- Vyber pohon --</option><option value="Pohon predných kolies">Pohon predných kolies</option><option value="Pohon zadných kolies">Pohon zadných kolies</option><option value="Pohon všetkých kolies (4x4)">Pohon všetkých kolies (4x4)</option></select></div><div><label class="label">Farba</label><input id="color" class="input"></div><div><label class="label">Predajná cena (€)</label><input id="price_eur" class="input"></div><div><label class="label">Stav</label><select id="status" class="input"><option value="available">VOĽNÉ</option><option value="reserved">REZERVOVANÉ</option><option value="sold">PREDANÉ</option></select></div><div><label class="label">Nákupná cena bez DPH (€) – INTERNÉ</label><input id="purchase_price_net_eur" class="input" type="number" step="0.01" min="0"></div><div><label class="label">Nákupná cena s DPH (€) – INTERNÉ</label><input id="purchase_price_gross_eur" class="input" type="number" step="0.01" min="0" oninput="calcPurchaseNet()"></div><div><label class="label">DPH pri nákupe</label><select id="purchase_vat_rate" class="input" onchange="calcPurchaseNet()"><option value="19">19 %</option><option value="20">20 %</option><option value="21">21 %</option><option value="22">22 %</option><option value="23" selected>23 %</option></select></div><div class="full"><label class="label">Výbava</label><textarea id="equipment" class="input" rows="7"></textarea></div><div class="full"><label class="label">Popis</label><textarea id="description" class="input" rows="4"></textarea></div></div><div class="panel full" id="photoPanel" style="display:none;margin-top:18px"><h2>Fotografie vozidla</h2><div class="notice">Máš dve možnosti: automaticky stiahnuť fotografie z pôvodného inzerátu alebo vybrať vlastné fotografie z PC. Potom môžeš fotografie mazať a meniť ich poradie.</div><div class="actions" style="margin:10px 0 4px"><button class="btn" onclick="importPhotos()">AUTOMATICKY IMPORTOVAŤ Z PÔVODNÉHO LINKU</button><button class="btn dark" onclick="document.getElementById('photoFiles').click()">MANUÁLNE VYBRAŤ FOTOGRAFIE Z PC</button></div><input id="photoFiles" class="input" style="display:none" type="file" accept="image/*" multiple onchange="uploadPhotos()"><div id="photoMsg"></div><div id="photoProgress" class="progressBox" style="display:none"><div class="progressTrack"><div id="photoProgressBar" class="progressBar"></div></div><div id="photoProgressText" class="progressText"></div></div><div id="photoGallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px"></div></div><div class="actions"><button class="btn" onclick="save()">ULOŽIŤ ZMENY</button><button class="btn dark" onclick="removeCar()">ZMAZAŤ</button></div><div style="margin-top:28px;padding-top:16px;border-top:1px solid var(--line)"><a class="btn dark" href="/">← Verejný web</a></div></section></div></div><script>
let current=null;let sourcePhotoCount=0;function setPhotoProgress(active,done=0,total=0,text=""){const box=document.getElementById("photoProgress"),bar=document.getElementById("photoProgressBar"),label=document.getElementById("photoProgressText");if(!box)return;if(!active){box.style.display="none";bar.classList.remove("busy");bar.style.width="0";label.textContent="";return}box.style.display="block";if(total>0){bar.classList.remove("busy");bar.style.width=Math.min(100,Math.round(done/total*100))+"%";label.textContent=text||("Spracované fotografie: "+done+" / "+total+" ("+Math.min(100,Math.round(done/total*100))+" %)")}else{bar.classList.add("busy");bar.style.width="45%";label.textContent=text||"Fotografie sa spracúvajú…"}}async function importCar(){const url=document.getElementById("url").value.trim();if(!url)return note("Vlož URL.","warn");note("Importujem údaje…","ok");try{const r=await fetch("/api/import",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({url})});const x=await r.json();if(!r.ok)throw Error(x.error||"Import zlyhal");sourcePhotoCount=(x.imported.images||[]).length;current={id:crypto.randomUUID(),title:x.imported.title||"Nové vozidlo",subtitle:"",year:x.imported.year,km:x.imported.km,power:x.imported.power,range_km:x.imported.range_km,drive:x.imported.drive,color:x.imported.color,price_eur:0,purchase_price_eur:0,purchase_price_net_eur:0,purchase_price_gross_eur:0,status:"available",description:x.imported.description,images:[],equipment:x.imported.equipment||[],source_url:x.source};fill(current);note(`Import hotový. Fotografie: ${current.images?.length||0}. Skontroluj údaje a nastav svoju predajnú cenu.`,"ok")}catch(e){note(e.message,"warn")}}
function fill(c){document.getElementById("editor").style.display="block";document.getElementById("photoPanel").style.display="block";renderPhotos();for(const k of ["title","subtitle","year","km","power","range_km","drive","color","price_eur","purchase_price_net_eur","purchase_price_gross_eur","purchase_vat_rate","status","description"])document.getElementById(k).value=c[k]??(k==="purchase_vat_rate"?"19":"");document.getElementById("equipment").value=(c.equipment||[]).join("\n");calcPurchaseNet()}
let saving=false;async function save(){if(!current||saving)return;saving=true;const btn=document.querySelector('button[onclick="save()"]');if(btn){btn.disabled=true;btn.textContent="UKLADÁM…"}note("Ukladám vozidlo do databázy…","ok");try{const b={id:current.id,title:v("title"),subtitle:v("subtitle"),year:v("year"),km:v("km"),power:v("power"),range_km:v("range_km"),drive:v("drive"),color:v("color"),price_eur:v("price_eur"),purchase_price_eur:v("purchase_price_gross_eur")||v("purchase_price_net_eur"),purchase_price_net_eur:v("purchase_price_net_eur"),purchase_price_gross_eur:v("purchase_price_gross_eur"),purchase_vat_rate:v("purchase_vat_rate"),status:v("status"),description:v("description"),equipment:v("equipment").split("\n").map(x=>x.trim()).filter(Boolean),source_url:current.source_url||""};const r=await fetch("/api/cars",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});const raw=await r.text();let x={};try{x=JSON.parse(raw)}catch{}if(!r.ok)throw Error(x.error||("Server vrátil HTTP "+r.status));current.id=x.id||current.id;note("✓ Vozidlo bolo úspešne uložené.","ok");await loadCars();alert("Vozidlo bolo úspešne uložené.Na verejnej stránke sa zobrazí ihneď. Fotografie sa spracúvajú na pozadí.");}catch(e){note("Uloženie sa nepodarilo: "+(e?.message||e),"warn");}finally{saving=false;if(btn){btn.disabled=false;btn.textContent="ULOŽIŤ ZMENY"}}}
async function loadCars(){try{const r=await fetch("/api/admin/cars",{cache:"no-store"});const x=await r.json();document.getElementById("cars").innerHTML=(x.cars||[]).map(c=>`<div class="car"><div style="display:flex;gap:10px;align-items:flex-start"><input class="carCheck" type="checkbox" value="${esc(c.id)}" onchange="updateSelectedCount()"><div><b>${esc(c.title)}</b><span class="muted">${esc(c.year||"")} • ${esc(c.km||"")} • ${c.status==="sold"?"PREDANÉ":c.status==="reserved"?"REZERVOVANÉ":"VOĽNÉ"}</span></div><div><span style="font-size:13px;margin-right:12px">Nákup bez DPH: <b>${fmt(c.purchase_price_net_eur)}</b><br>Nákup s DPH: <b>${fmt(c.purchase_price_gross_eur)}</b> (${fmtRate(c.purchase_vat_rate)})</span><span class="price">Predaj: ${fmt(c.price_eur)}</span> <button class="btn dark" onclick="edit('${c.id}')">Upraviť</button></div></div></div>`).join("")||"Zatiaľ žiadne vozidlá."}catch{document.getElementById("cars").innerHTML="D1 zatiaľ nie je nakonfigurovaná."}}
async function edit(id){const r=await fetch("/api/admin/cars/"+id);const x=await r.json();current={...x.car,images:x.photos.map(p=>p.url),equipment:x.equipment};fill(current);renderPhotos();scrollTo({top:500,behavior:"smooth"})}
async function ensurePhotoCarSaved(){if(!current?.id)return false;const check=await fetch("/api/cars/"+encodeURIComponent(current.id));if(check.ok)return true;const b={id:current.id,title:v("title"),subtitle:v("subtitle"),year:v("year"),km:v("km"),power:v("power"),range_km:v("range_km"),drive:v("drive"),color:v("color"),price_eur:v("price_eur"),purchase_price_eur:v("purchase_price_gross_eur")||v("purchase_price_net_eur"),purchase_price_net_eur:v("purchase_price_net_eur"),purchase_price_gross_eur:v("purchase_price_gross_eur"),purchase_vat_rate:v("purchase_vat_rate"),status:v("status"),description:v("description"),equipment:v("equipment").split("\n").map(x=>x.trim()).filter(Boolean),source_url:current.source_url||""};if(!b.title)return false;const r=await fetch("/api/cars",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});const x=await r.json();if(!r.ok)throw Error(x.error||"Vozidlo sa nepodarilo uložiť");current.id=x.id||current.id;return true}
async function importPhotos(){if(!current?.id)return;try{if(!await ensurePhotoCarSaved())throw Error("Najprv vyplň názov vozidla.");setPhotoProgress(true,0,sourcePhotoCount,sourcePhotoCount?("Sťahujem fotografie: 0 / "+sourcePhotoCount):"Sťahujem fotografie z pôvodného inzerátu…");photoStatus("Importujem fotografie z pôvodného linku…","ok");const r=await fetch("/api/cars/"+encodeURIComponent(current.id)+"/photo-import",{method:"POST"});const x=await r.json();if(!r.ok)throw Error(x.error||"Automatický import fotografií zlyhal");const r2=await fetch("/api/cars/"+encodeURIComponent(current.id));const y=await r2.json();current.images=(y.photos||[]).map(p=>p.url);renderPhotos();setPhotoProgress(true,x.count,sourcePhotoCount||x.count,"✓ Import dokončený: "+x.count+" / "+(sourcePhotoCount||x.count)+" fotografií (100 %)");photoStatus("✓ Automaticky importovaných fotografií: "+x.count+".","ok");setTimeout(()=>setPhotoProgress(false),1800)}catch(e){setPhotoProgress(false);photoStatus("Automatický import fotografií sa nepodaril: "+(e?.message||e),"warn")}}
async function uploadPhotos(){if(!current?.id)return;const input=document.getElementById("photoFiles");if(!input.files.length)return;try{if(!await ensurePhotoCarSaved())throw Error("Najprv vyplň názov vozidla.");setPhotoProgress(true,0,input.files.length,"Nahrávam fotografie: 0 / "+input.files.length);photoStatus("Nahrávam "+input.files.length+" fotografií…","ok");const form=new FormData();for(const f of input.files)form.append("files",f,f.name);const r=await fetch("/api/cars/"+encodeURIComponent(current.id)+"/photo-upload-batch",{method:"POST",body:form});const x=await r.json();if(!r.ok)throw Error(x.error||"Nahratie fotografií zlyhalo");const r2=await fetch("/api/cars/"+encodeURIComponent(current.id));const y=await r2.json();current.images=(y.photos||[]).map(p=>p.url);input.value="";renderPhotos();setPhotoProgress(true,x.count,input.files.length||x.count,"✓ Nahrávanie dokončené: "+x.count+" / "+(input.files.length||x.count)+" fotografií (100 %)");photoStatus("✓ Nahratých fotografií: "+x.count+".","ok");setTimeout(()=>setPhotoProgress(false),1800)}catch(e){input.value="";setPhotoProgress(false);photoStatus("Nahratie fotografií sa nepodarilo: "+(e?.message||e),"warn")}}

let dragPhotoIndex=null;function renderPhotos(){const el=document.getElementById("photoGallery");if(!el)return;const imgs=current?.images||[];el.innerHTML=imgs.map((p,i)=>'<div draggable="true" ondragstart="dragPhotoIndex='+i+'" ondragover="event.preventDefault()" ondrop="dropPhoto('+i+')" style="background:#090909;border:1px solid #2a2a2a;border-radius:8px;padding:6px;cursor:grab"><img src="'+esc(p)+'" alt="Fotografia '+(i+1)+'" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;display:block"><div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 2px 0"><span class="muted">Foto '+(i+1)+'</span><button class="btn dark" style="padding:5px 8px;font-size:11px" onclick="deletePhoto('+i+');event.stopPropagation()">ZMAZAŤ</button></div></div>').join("")||'<div class="muted">Zatiaľ nie sú nahraté žiadne fotografie.</div>'}async function dropPhoto(to){if(dragPhotoIndex===null||dragPhotoIndex===to)return;const arr=[...(current.images||[])],moved=arr.splice(dragPhotoIndex,1)[0];arr.splice(to,0,moved);dragPhotoIndex=null;current.images=arr;renderPhotos();try{const r=await fetch("/api/cars/"+encodeURIComponent(current.id)+"/photos/reorder",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({urls:arr})});const x=await r.json();if(!r.ok)throw Error(x.error||"Poradie sa nepodarilo uložiť");note("✓ Poradie fotografií uložené.","ok")}catch(e){note("Poradie sa nepodarilo uložiť: "+(e?.message||e),"warn")}}async function deletePhoto(i){const url=current?.images?.[i];if(!url)return;if(!confirm("Naozaj zmazať túto fotografiu?"))return;try{const r=await fetch("/api/cars/"+encodeURIComponent(current.id)+"/photo",{method:"DELETE",headers:{"content-type":"application/json"},body:JSON.stringify({url})});const x=await r.json();if(!r.ok)throw Error(x.error||"Fotografiu sa nepodarilo zmazať");current.images.splice(i,1);renderPhotos();note("✓ Fotografia bola zmazaná.","ok")}catch(e){note("Fotografiu sa nepodarilo zmazať: "+(e?.message||e),"warn")}}
async function removeCar(){if(!current?.id)return;if(!confirm("Naozaj zmazať vozidlo?"))return;await fetch("/api/cars/"+current.id,{method:"DELETE"});current=null;document.getElementById("editor").style.display="none";loadCars()}
function updateSelectedCount(){const n=document.querySelectorAll(".carCheck:checked").length;document.getElementById("selectedCount").textContent=n?n+" vybraných":""}
function toggleAllCars(){const boxes=[...document.querySelectorAll(".carCheck")];const all=boxes.length&&boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);updateSelectedCount()}
async function deleteSelectedCars(){const ids=[...document.querySelectorAll(".carCheck:checked")].map(x=>x.value);if(!ids.length)return alert("Najprv vyber vozidlá, ktoré chceš zmazať.");if(!confirm("Naozaj zmazať "+ids.length+" vybraných vozidiel?"))return;try{const r=await fetch("/api/admin/cars/bulk-delete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ids})});const x=await r.json();if(!r.ok)throw Error(x.error||"Mazanie zlyhalo");if(current&&ids.includes(current.id)){current=null;document.getElementById("editor").style.display="none"}await loadCars();updateSelectedCount();note("✓ Zmazaných vozidiel: "+x.count,"ok")}catch(e){note("Hromadné mazanie sa nepodarilo: "+(e?.message||e),"warn")}}
function photoStatus(t,c){const el=document.getElementById("photoMsg");if(el)el.innerHTML='<div class="notice '+(c||"")+'">'+esc(t)+'</div>';note(t,c)}function calcPurchaseNet(){const gross=Number(v("purchase_price_gross_eur"))||0;const rate=Number(v("purchase_vat_rate"))||19;document.getElementById("purchase_price_net_eur").value=gross>0?(gross/(1+rate/100)).toFixed(2):""}function fmtRate(v){const n=Number(v)||23;return n+" % DPH"}function v(id){return document.getElementById(id).value}function note(t,c){document.getElementById("msg").innerHTML=`<div class="notice ${c||""}">${esc(t)}</div>`}function fmt(v){return new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(v)||0)}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}loadCars();
</script></body></html>
