<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReVolt Drive | Audi Q4 e-tron</title>
<style>
:root{--g:#9cff00;--bg:#050505;--card:#101010;--line:#292929;--muted:#9b9b9b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.94);backdrop-filter:blur(12px);border-bottom:1px solid #1e1e1e}
.wrap{max-width:1180px;margin:auto;padding:0 22px}.nav{height:104px;display:flex;align-items:center;justify-content:space-between;padding-top:8px}.logo{width:190px;height:auto;max-width:190px;object-fit:contain;display:block}
nav a{margin-left:24px;text-decoration:none;color:#fff;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.hero{text-align:center;padding:32px 0 24px}.k{color:var(--g);font-size:12px;font-weight:900;letter-spacing:.22em;text-transform:uppercase}
h1{font-size:clamp(36px,5vw,64px);margin:8px 0 6px;letter-spacing:-.05em;text-transform:uppercase}.hero p{max-width:690px;margin:auto;color:var(--muted);line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding-bottom:80px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#555}
.photo{aspect-ratio:16/9;background:#222;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:12px;top:12px;background:var(--g);color:#000;padding:7px 9px;border-radius:6px;font-size:10px;font-weight:900;text-transform:uppercase}
.body{padding:18px}.body h2{margin:0 0 5px;font-size:22px}.sub{color:var(--muted);font-size:13px}.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);margin-top:15px;padding-top:13px}.spec span{display:block;color:var(--muted);font-size:9px}.spec b{font-size:13px}.bottom{display:flex;align-items:end;justify-content:space-between;margin-top:18px}.price{color:var(--g);font-weight:950;font-size:26px}.btn{border:0;background:var(--g);color:#000;border-radius:8px;padding:11px 13px;font-weight:950;font-size:11px;text-transform:uppercase;cursor:pointer}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);overflow:auto;padding:24px}.modal.on{display:block}.box{max-width:1100px;margin:auto;background:#0b0b0b;border:1px solid #333;border-radius:16px;overflow:hidden}.close{position:fixed;right:22px;top:15px;border:1px solid #555;background:#111;color:#fff;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer;z-index:31}
.detail{padding:24px 24px 42px}.head{display:flex;justify-content:space-between;gap:20px}.head h2{font-size:32px;margin:5px 0}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.gallery img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}.mainimg{aspect-ratio:16/9;overflow:hidden;min-width:0}.side{display:none}.info{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{border:1px solid var(--line);border-radius:10px;padding:16px}.panel h3{margin:0 0 12px;color:var(--g);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.six{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.six div{border-bottom:1px solid var(--line);padding-bottom:8px}.six span{display:block;color:var(--muted);font-size:9px}.six b{font-size:13px}.equip{columns:2;padding-left:18px;margin:0}.equip li{margin:0 0 7px;font-size:13px}.equip li::marker{color:var(--g)}
.lightbox{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.96);align-items:center;justify-content:center;padding:60px 70px}.lightbox.on{display:flex}.lightbox img{max-width:92vw;max-height:86vh;width:auto;height:auto;object-fit:contain;border-radius:6px}.lbclose{position:absolute;right:20px;top:14px;width:44px;height:44px;border:1px solid #555;border-radius:50%;background:#111;color:#fff;font-size:28px;cursor:pointer}.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:70px;border:1px solid #555;border-radius:10px;background:rgba(20,20,20,.85);color:#fff;font-size:42px;line-height:1;cursor:pointer}.lbprev{left:15px}.lbnext{right:15px}.lbcount{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#111;padding:7px 12px;border-radius:20px;font-size:12px}.gallery .mainimg{cursor:zoom-in}.gallery .mainimg img{cursor:zoom-in}

@media(max-width:760px){nav{display:none}.grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr;grid-template-rows:none;height:140px}.info{grid-template-columns:1fr}.six{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="wrap nav"><img class="logo" src="images/revolt-vrch.jpg" alt="ReVolt Drive"><nav><a href="#ponuka">Ponuka</a><a href="#kontakt">Kontakt</a></nav></div></header>
<section class="hero"><div class="wrap"><div class="k">ReVolt Drive</div><h1>Audi Q4 e-tron</h1><p>Konkrétna ponuka vozidiel vybraná pre vás. Kliknite na vozidlo a pozrite si fotografie, technické údaje a výbavu.</p></div></section>
<main class="wrap"><div id="ponuka" class="grid"></div></main>
<footer id="kontakt"><div class="wrap"><b style="color:#fff">ReVolt Drive</b><br><br>Dovoz • Previerka • Diagnostika • Predaj<br>Kontakt doplníme v administrácii.</div></footer>
<div id="modal" class="modal"><button class="close" onclick="closeDetail()">×</button><div id="detail" class="box"></div></div><div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLightbox()"><button class="lbclose" onclick="closeLightbox()">×</button><button class="lbnav lbprev" onclick="event.stopPropagation();prevPhoto()">‹</button><img id="lightboxImg" src="" alt=""><button class="lbnav lbnext" onclick="event.stopPropagation();nextPhoto()">›</button><div id="lbcount" class="lbcount"></div></div>
<script>
const fallback=[{id:"demo1",title:"Audi Q4 e-tron Sportback 40",subtitle:"Navi • Panoráma • 150 kW",year:"06/2023",km:"77 053 km",power:"150 kW / 204 k",range_km:"479 km",drive:"zadný pohon",color:"Biela metalíza",price_eur:27990,status:"available",description:"Konkrétne vozidlo z ponuky.",images:[]},{id:"demo2",title:"Audi Q4 e-tron 40 Edition One",subtitle:"S line • Matrix • AHK",year:"08/2022",km:"79 612 km",power:"150 kW / 204 k",range_km:"466 km",drive:"zadný pohon",color:"Sivá metalíza",price_eur:28830,status:"available",description:"Edition One so športovou výbavou.",images:[]},{id:"demo3",title:"Audi Q4 e-tron 40",subtitle:"LED • NAVI • Vyhrievané sedadlá",year:"12/2022",km:"43 600 km",power:"150 kW / 204 k",range_km:"425 km",drive:"zadný pohon",color:"Čierna metalíza",price_eur:29970,status:"available",description:"Nízky nájazd a bohatá výbava.",images:[]},{id:"demo4",title:"Audi Q4 e-tron 35",subtitle:"125 kW • Kamera • Koža",year:"07/2022",km:"60 990 km",power:"125 kW / 170 k",range_km:"313 km",drive:"zadný pohon",color:"Biela metalíza",price_eur:26890,status:"available",description:"Q4 35 e-tron s praktickou výbavou.",images:[]}];
async function load(){const el=document.getElementById("ponuka");el.innerHTML="<div style=\"grid-column:1/-1;text-align:center;color:#9b9b9b;padding:60px 0\">Načítavam ponuku…</div>";try{const r=await fetch("/api/cars",{cache:"no-store"});const x=await r.json();if(!r.ok)throw Error(x.error||"Databáza nie je dostupná.");const cars=(x.cars||[]).map(c=>({...c,images:c.cover_url?[c.cover_url]:[]})).filter(c=>c.status!=="sold");el.innerHTML=cars.length?cars.map(card).join(""):"<div style=\"grid-column:1/-1;text-align:center;color:#9b9b9b;padding:60px 0\">Momentálne nemáme žiadne vozidlo v ponuke.</div>"}catch(e){el.innerHTML="<div style=\"grid-column:1/-1;text-align:center;color:#aaa;padding:60px 0\">Ponuku sa nepodarilo načítať. Skontrolujme databázové napojenie.</div>"}}
function card(c){const img=c.images?.[0]||"";return `<article class="card" onclick="openDetail('${c.id}')"><div class="photo">${img?`<img src="${esc(img)}">`:""}<span class="tag">Elektrické</span></div><div class="body"><h2>${esc(c.title)}</h2><div class="sub">${esc(c.subtitle||"")}</div><div class="spec"><div><span>ROK</span><b>${esc(c.year||"-")}</b></div><div><span>KM</span><b>${esc(c.km||"-")}</b></div><div><span>VÝKON</span><b>${esc(c.power||"-")}</b></div><div><span>DOJAZD</span><b>${esc(c.range_km||"-")}</b></div></div><div class="bottom"><div class="price">${fmt(c.price_eur)}</div><button class="btn">Detail</button></div></div></article>`}
let galleryPhotos=[];let galleryIndex=0;
function openLightbox(index){galleryIndex=index;const lb=document.getElementById("lightbox");document.getElementById("lightboxImg").src=galleryPhotos[galleryIndex]||"";document.getElementById("lbcount").textContent=(galleryIndex+1)+" / "+galleryPhotos.length;lb.classList.add("on");document.body.style.overflow="hidden"}
function closeLightbox(){document.getElementById("lightbox").classList.remove("on");if(document.getElementById("modal").classList.contains("on"))document.body.style.overflow="hidden";else document.body.style.overflow=""}
function prevPhoto(){if(!galleryPhotos.length)return;galleryIndex=(galleryIndex-1+galleryPhotos.length)%galleryPhotos.length;openLightbox(galleryIndex)}
function nextPhoto(){if(!galleryPhotos.length)return;galleryIndex=(galleryIndex+1)%galleryPhotos.length;openLightbox(galleryIndex)}
function photoKey(e){if(!document.getElementById("lightbox").classList.contains("on"))return;if(e.key==="ArrowLeft")prevPhoto();if(e.key==="ArrowRight")nextPhoto();if(e.key==="Escape")closeLightbox()}
document.addEventListener("keydown",photoKey);
async function openDetail(id){let c=fallback.find(x=>x.id===id);try{const r=await fetch("/api/cars/"+encodeURIComponent(id));if(r.ok){const x=await r.json();c={...x.car,images:x.photos.map(p=>p.url),equipment:x.equipment}}}catch{}const photos=c.images||[];galleryPhotos=photos;galleryIndex=0;document.getElementById("detail").innerHTML=`<div class="detail"><div class="head"><div><div class="k">${esc(c.subtitle||"Audi Q4 e-tron")}</div><h2>${esc(c.title)}</h2></div><div class="price">${fmt(c.price_eur)}</div></div>${photos.length?`<div class="gallery">${photos.map((p,i)=>`<div class="mainimg" onclick="openLightbox(${i})"><img src="${esc(p)}"></div>`).join("")}</div>`:""}<div class="info"><div class="panel"><h3>Technické údaje</h3><div class="six">${[["Rok",c.year],["Kilometre",c.km],["Výkon",c.power],["Dojazd",c.range_km],["Pohon",c.drive],["Farba",c.color]].map(x=>`<div><span>${x[0]}</span><b>${esc(x[1]||"-")}</b></div>`).join("")}</div></div><div class="panel"><h3>Výbava</h3><ul class="equip">${(c.equipment||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div>`;document.getElementById("modal").classList.add("on");document.body.style.overflow="hidden"}
function closeDetail(){document.getElementById("modal").classList.remove("on");document.body.style.overflow=""}
function fmt(v){return new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(v)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load();
</script></body></html>
