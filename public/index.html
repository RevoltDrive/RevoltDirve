<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReVolt Drive | Audi Q4 e-tron</title>
<style>
:root{--g:#9cff00;--bg:#050505;--card:#101010;--line:#292929;--muted:#9b9b9b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.94);backdrop-filter:blur(12px);border-bottom:1px solid #1e1e1e}
.wrap{max-width:1180px;margin:auto;padding:0 22px}.nav{height:104px;display:flex;align-items:center;justify-content:space-between;padding-top:8px;position:relative}.logo{width:190px;height:auto;max-width:190px;object-fit:contain;display:block}.centerlogo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;object-fit:contain;border-radius:50%}
nav a{margin-left:24px;text-decoration:none;color:#fff;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.hero{text-align:center;padding:32px 0 24px}.k{color:var(--g);font-size:12px;font-weight:900;letter-spacing:.22em;text-transform:uppercase}
h1{font-size:clamp(36px,5vw,64px);margin:8px 0 6px;letter-spacing:-.05em;text-transform:uppercase}.hero p{max-width:690px;margin:auto;color:var(--muted);line-height:1.45}
.sortbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:0 0 18px}.sortbar label{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.12em}.sortbar select{appearance:none;background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:9px 34px 9px 11px;font-size:11px;font-weight:800;cursor:pointer}.sortbar select:focus{outline:1px solid var(--g);border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:80px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s;cursor:pointer;display:flex;flex-direction:column}.card.recommended{border-color:#8b6a00;box-shadow:0 0 0 1px #4c3d00,0 0 22px rgba(255,210,0,.12)}.recommendTag{position:absolute;right:8px;bottom:8px;top:auto;background:#ffd400;color:#111;padding:4px 7px;border-radius:6px;font-size:9px;font-weight:950;letter-spacing:.02em;box-shadow:0 2px 10px rgba(0,0,0,.35)}.card:hover{transform:translateY(-3px);border-color:#555}
.photo{aspect-ratio:16/9;background:#222;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.vehicleCodeTag{display:inline-block;align-self:flex-start;margin:0 0 7px;padding:4px 8px;background:#0d1f33;color:#62a8ff;border:1px solid #2d5f94;border-radius:6px;font-size:10px;font-weight:900;letter-spacing:.35px}.tag{position:absolute;left:8px;bottom:8px;top:auto;background:var(--g);color:#000;padding:5px 7px;border-radius:5px;font-size:9px;font-weight:900;text-transform:uppercase}
.body{padding:14px;display:flex;flex-direction:column;flex:1;min-height:0;height:auto}.body h2{margin:0 0 5px;font-size:18px;line-height:1.25;height:72px;min-height:72px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.sub{color:var(--muted);font-size:13px}.spec{display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:0;border-top:1px solid var(--line);margin-top:15px;padding-top:13px;height:63px;min-height:63px}.spec span{display:block;color:var(--muted);font-size:8px;margin-bottom:4px;text-align:center}.spec b{font-size:12px;white-space:nowrap;letter-spacing:0;display:block;text-align:center} .spec>div+div{border-left:1px solid #292929;padding-left:4px}.spec>div{padding:0 4px}.bottom{display:flex;align-items:end;justify-content:space-between;margin-top:auto;padding-top:18px;min-height:78px;height:78px}.price{color:var(--g);font-weight:950;font-size:21px}.priceNet{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}.priceVat{font-size:10px;color:var(--muted);font-weight:500;margin-top:1px}.btn{border:0;background:var(--g);color:#000;border-radius:8px;padding:11px 13px;font-weight:950;font-size:11px;text-transform:uppercase;cursor:pointer}
.serviceInfoItem{position:relative}.serviceInfo{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:4px;padding:0;border:0;border-radius:50%;background:#9b9b9b;color:#050505;font-size:10px;font-weight:900;line-height:15px;vertical-align:middle;cursor:help}.serviceInfoTip{position:absolute;right:-10px;left:auto;bottom:calc(100% + 10px);transform:translateY(4px);width:285px;padding:12px 13px;border-radius:5px;background:#202b55;color:#fff;font-size:12px;font-weight:500;line-height:1.45;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:50}.serviceInfoTip:after{content:"";position:absolute;right:10px;left:auto;bottom:-6px;transform:none;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #202b55}.serviceInfo:hover .serviceInfoTip,.serviceInfo.on .serviceInfoTip{opacity:1;visibility:visible;transform:translateY(0)}@media(max-width:600px){.serviceInfoTip{left:auto;right:-10px;transform:translateY(4px);width:min(285px,calc(100vw - 70px));text-align:left}.serviceInfo:hover .serviceInfoTip,.serviceInfo.on .serviceInfoTip{transform:translateY(0)}.serviceInfoTip:after{left:auto;right:10px;transform:none}}footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);overflow:auto;padding:24px}.modal.on{display:block}.box{max-width:1100px;margin:auto;background:#0b0b0b;border:1px solid #333;border-radius:16px;overflow:hidden}.close{position:fixed;right:22px;top:15px;border:1px solid #555;background:#111;color:#fff;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer;z-index:31}
.detail{padding:24px 24px 42px}.head{display:flex;justify-content:space-between;gap:20px}.head h2{font-size:32px;margin:5px 0}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.gallery img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}.mainimg{aspect-ratio:16/9;overflow:hidden;min-width:0}.side{display:none}.info{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{border:1px solid var(--line);border-radius:10px;padding:16px}.panel h3{margin:0 0 12px;color:var(--g);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.six{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.six div{border-bottom:1px solid var(--line);padding-bottom:8px}.six span{display:block;color:var(--muted);font-size:9px}.six b{font-size:13px}.priceInfo{line-height:1.55;font-size:13px}.priceInfo .inc{color:#fff;margin-bottom:12px}.priceInfo .exc{color:#fff}.priceInfo b{color:var(--g)}.priceInfo ul{margin:7px 0 0;padding-left:18px}.priceInfo li{margin:4px 0}.exclusive{grid-column:1/-1}.equip{columns:2;padding-left:18px;margin:0}.equip li{margin:0 0 7px;font-size:13px}.equip li::marker{color:var(--g)}
.lightbox{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.96);align-items:center;justify-content:center;padding:60px 70px}.lightbox.on{display:flex}.lightbox img{max-width:92vw;max-height:86vh;width:auto;height:auto;object-fit:contain;border-radius:6px}.lbclose{position:absolute;right:20px;top:14px;width:44px;height:44px;border:1px solid #555;border-radius:50%;background:#111;color:#fff;font-size:28px;cursor:pointer}.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:70px;border:1px solid #555;border-radius:10px;background:rgba(20,20,20,.85);color:#fff;font-size:42px;line-height:1;cursor:pointer}.lbprev{left:15px}.lbnext{right:15px}.lbcount{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#111;padding:7px 12px;border-radius:20px;font-size:12px}.gallery .mainimg{cursor:zoom-in}.gallery .mainimg img{cursor:zoom-in}

@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){nav{display:none}.grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr;grid-template-rows:none;height:140px}.info{grid-template-columns:1fr}.six{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="wrap nav"><img class="logo" src="images/revolt-vrch.jpg" alt="ReVolt Drive"><img class="centerlogo" src="https://at.adobe.com/Ydk6FT0OZUgluXiH" alt="ReVolt Drive logo"><div style="display:flex;align-items:center;gap:26px"><a href="https://www.revoltdrive.sk" target="_blank" rel="noopener" style="color:#fff;font-weight:950;text-decoration:none;font-size:14px;line-height:1.25;text-align:right;white-space:nowrap">Kompletná ponuka<br><span style="color:var(--g)">www.revoltdrive.sk</span></a><div style="text-align:right;line-height:1.35;font-size:12px;color:#fff"><b>Roman Vaľo</b><br><span style="color:#9b9b9b">+421 903 770 869</span><br><span style="color:#9b9b9b">info@revoltdrive.sk</span></div><nav></nav></div></div></header>
<section class="hero"><div class="wrap"><h1>Audi Q4 e-tron</h1><p>Konkrétna ponuka vozidiel vybraná pre vás. Kliknite na vozidlo a pozrite si fotografie, technické údaje a výbavu.</p></div></section>
<main class="wrap">
<div class="sortbar">
  <label for="sortSelect">ZORADIŤ PONUKU</label>
  <select id="sortSelect" onchange="changeSort(this.value)">
    <option value="newest">Najnovšie pridané</option>
    <option value="oldest">Najstaršie pridané</option>
    <option value="priceHigh">Cena – najvyššia</option>
    <option value="priceLow">Cena – najnižšia</option>
  </select>
</div>
<div id="ponuka" class="grid"></div>
</main>
<footer id="kontakt"><div class="wrap"><b style="color:#fff">Roman Vaľo</b><br><br>+421 903 770 869<br>www.revoltdrive.sk<br>info@revoltdrive.sk</div></footer>
<div id="modal" class="modal"><button class="close" onclick="closeDetail()">×</button><div id="detail" class="box"></div></div><div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLightbox()"><button class="lbclose" onclick="closeLightbox()">×</button><button class="lbnav lbprev" onclick="event.stopPropagation();prevPhoto()">‹</button><img id="lightboxImg" src="" alt=""><button class="lbnav lbnext" onclick="event.stopPropagation();nextPhoto()">›</button><div id="lbcount" class="lbcount"></div></div>
<script>
const fallback=[{id:"demo1",title:"Audi Q4 e-tron Sportback 40",subtitle:"Navi • Panoráma • 150 kW",year:"06/2023",km:"77 053 km",power:"150 kW / 204 k",range_km:"479 km",drive:"zadný pohon",color:"Biela metalíza",price_eur:27990,status:"available",description:"Konkrétne vozidlo z ponuky.",images:[]},{id:"demo2",title:"Audi Q4 e-tron 40 Edition One",subtitle:"S line • Matrix • AHK",year:"08/2022",km:"79 612 km",power:"150 kW / 204 k",range_km:"466 km",drive:"zadný pohon",color:"Sivá metalíza",price_eur:28830,status:"available",description:"Edition One so športovou výbavou.",images:[]},{id:"demo3",title:"Audi Q4 e-tron 40",subtitle:"LED • NAVI • Vyhrievané sedadlá",year:"12/2022",km:"43 600 km",power:"150 kW / 204 k",range_km:"425 km",drive:"zadný pohon",color:"Čierna metalíza",price_eur:29970,status:"available",description:"Nízky nájazd a bohatá výbava.",images:[]},{id:"demo4",title:"Audi Q4 e-tron 35",subtitle:"125 kW • Kamera • Koža",year:"07/2022",km:"60 990 km",power:"125 kW / 170 k",range_km:"313 km",drive:"zadný pohon",color:"Biela metalíza",price_eur:26890,status:"available",description:"Q4 35 e-tron s praktickou výbavou.",images:[]}];
let allCars=[];let sortMode="newest";
function sortCars(cars){return [...cars].sort((a,b)=>{if(sortMode==="priceHigh")return (Number(b.price_eur)||0)-(Number(a.price_eur)||0);if(sortMode==="priceLow")return (Number(a.price_eur)||0)-(Number(b.price_eur)||0);const da=Date.parse(a.created_at||"")||0,db=Date.parse(b.created_at||"")||0;return sortMode==="oldest"?da-db:db-da})}
function renderCars(){const el=document.getElementById("ponuka");const cars=sortCars(allCars);el.innerHTML=cars.length?cars.map(card).join(""):"<div style=\"grid-column:1/-1;text-align:center;color:#9b9b9b;padding:60px 0\">Momentálne nemáme žiadne vozidlo v ponuke.</div>"}
function changeSort(value){sortMode=value||"newest";renderCars()}
async function load(){const el=document.getElementById("ponuka");el.innerHTML="<div style=\"grid-column:1/-1;text-align:center;color:#9b9b9b;padding:60px 0\">Načítavam ponuku…</div>";try{const r=await fetch("/api/cars",{cache:"no-store"});const x=await r.json();if(!r.ok)throw Error(x.error||"Databáza nie je dostupná.");allCars=(x.cars||[]).map(c=>({...c,images:c.cover_url?[c.cover_url]:[]})).filter(c=>Number(c.is_public)===1&&c.status!=="sold");renderCars()}catch(e){el.innerHTML="<div style=\"grid-column:1/-1;text-align:center;color:#aaa;padding:60px 0\">Ponuku sa nepodarilo načítať. Skontrolujme databázové napojenie.</div>"}}
function card(c){const img=c.images?.[0]||"";return `<article class="card ${Number(c.is_recommended??0)===1?"recommended":""}" onclick="openDetail('${c.id}')"><div class="photo">${img?`<img src="${esc(img)}">`:""}<span class="tag">Elektrické</span>${Number(c.is_recommended??0)===1?'<span class="recommendTag">⭐ ODPORÚČAME</span>':""}</div><div class="body"><h2>${esc(c.title)}</h2>${c.vehicle_code?`<div class="vehicleCodeTag">Číslo vozidla : ${esc(c.vehicle_code.replace(/^RD-/,"V-"))}</div>`:""}<div class="spec"><div><span>ROK</span><b>${esc(c.year||"-")}</b></div><div><span>KM</span><b>${esc(c.km||"-")}</b></div><div><span>VÝKON</span><b>${esc(c.power||"-")}</b></div></div><div class="bottom"><div><div class="price">${fmt(c.price_eur)}</div><div class="priceNet">${fmtNet(c.price_eur)} bez DPH (23%)</div></div><button class="btn">Detail</button></div></div></article>`}
let galleryPhotos=[];let galleryIndex=0;
function openLightbox(index){galleryIndex=index;const lb=document.getElementById("lightbox");document.getElementById("lightboxImg").src=galleryPhotos[galleryIndex]||"";document.getElementById("lbcount").textContent=(galleryIndex+1)+" / "+galleryPhotos.length;lb.classList.add("on");document.body.style.overflow="hidden"}
function closeLightbox(){document.getElementById("lightbox").classList.remove("on");if(document.getElementById("modal").classList.contains("on"))document.body.style.overflow="hidden";else document.body.style.overflow=""}
function prevPhoto(){if(!galleryPhotos.length)return;galleryIndex=(galleryIndex-1+galleryPhotos.length)%galleryPhotos.length;openLightbox(galleryIndex)}
function nextPhoto(){if(!galleryPhotos.length)return;galleryIndex=(galleryIndex+1)%galleryPhotos.length;openLightbox(galleryIndex)}
function photoKey(e){if(!document.getElementById("lightbox").classList.contains("on"))return;if(e.key==="ArrowLeft")prevPhoto();if(e.key==="ArrowRight")nextPhoto();if(e.key==="Escape")closeLightbox()}
document.addEventListener("keydown",photoKey);
async function openDetail(id){let c=fallback.find(x=>x.id===id);try{const r=await fetch("/api/cars/"+encodeURIComponent(id));if(r.ok){const x=await r.json();c={...x.car,images:x.photos.map(p=>p.url),equipment:x.equipment}}}catch{}const photos=c.images||[];galleryPhotos=photos;galleryIndex=0;document.getElementById("detail").innerHTML=`<div class="detail"><div class="head"><div><div style="display:inline-block;background:#111;color:#62a8ff;border:1px solid #2d5f94;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:7px">${esc((c.vehicle_code||"").replace(/^RD-/,"V-"))}</div><div class="k">${esc(c.subtitle||"Audi Q4 e-tron")}</div><h2>${esc(c.title)}</h2></div><div><div class="price">${fmt(c.price_eur)}</div><div class="priceNet">${fmtNet(c.price_eur)} bez DPH (23%)</div></div></div>${photos.length?`<div class="gallery">${photos.map((p,i)=>`<div class="mainimg" onclick="openLightbox(${i})"><img src="${esc(p)}"></div>`).join("")}</div>`:""}<div class="info"><div class="panel"><h3>Technické údaje</h3><div class="six">${[["Rok",c.year],["Kilometre",c.km],["Výkon",c.power],["Dojazd",c.range_km],["Pohon",c.drive],["Farba",c.color]].map(x=>`<div><span>${x[0]}</span><b>${esc(x[1]||"-")}</b></div>`).join("")}</div></div><div class="panel"><h3>Cena vozidla</h3><div class="priceInfo"><div class="inc"><b>Cena vozidla už obsahuje:</b><ul><li>poplatok za dovoz vozidla 800 €</li><li class="serviceInfoItem">Príprava vozidla + prvá registracia v SR + čistopis TP – 690 € <button type="button" class="serviceInfo" aria-label="Informácie o službe" onclick="event.stopPropagation();this.classList.toggle('on')" onmouseenter="this.classList.add('on')" onmouseleave="this.classList.remove('on')">i<span class="serviceInfoTip">V rámci služby zaistíme potrebnú administratívu, k vydaniu čistopisu technického preukazu 1. Dovozovú STK 2. Úradný preklad dokumentov k registrácii 3. Kontrolu originality 4. Vydanie originálu technického preukazu. 5. Poplatok za skladovanie s odpadom</span></button></li></ul></div><div class="exc"><b>Cena vozidla neobsahuje:</b><ul><li>poplatok za prihlásenie na konkrétnu osobu v TP</li><li>poplatok za vydanie EČV</li></ul></div></div></div>${c.exclusive_equipment?`<div class="panel exclusive"><h3>Exclusive výbava</h3><div style="font-size:15px;line-height:1.5;color:#fff;font-weight:700">${esc(c.exclusive_equipment)}</div></div>`:""}<div class="panel"><h3>Výbava</h3><ul class="equip">${(c.equipment||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div>`;document.getElementById("modal").classList.add("on");document.body.style.overflow="hidden"}
function closeDetail(){document.getElementById("modal").classList.remove("on");document.body.style.overflow=""}
function fmt(v){return new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(v)||0)}function fmtNet(v){const n=Number(v)||0;return new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n/1.23)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load();
</script></body></html>
