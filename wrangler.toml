name = "skoda-yeti-ivan"
main = "src/worker.js"
compatibility_date = "2026-09-18"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "skoda-yeti-ivan-db"
database_id = "REPLACE_WITH_NEW_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "skoda-yeti-ivan-photos"

# Production:
# - ADMIN_PASSWORD and authentication will be added before public launch.
